spring.application.name=cache-demo
server.port=8080

# --- Base de datos (H2 en archivo: no requiere instalar nada) ---
spring.datasource.url=jdbc:h2:file:./data/productsdb;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# --- Caché (Caffeine) ---
spring.cache.type=caffeine
spring.cache.cache-names=productsByCategory
spring.cache.caffeine.spec=maximumSize=100,expireAfterWrite=10m

# --- Datos de prueba: total de registros a generar la primera vez ---
app.seed.total=200000

# --- CORS: orígenes del front permitidos (solo desarrollo) ---
app.cors.allowed-origins=http://localhost:5500,http://127.0.0.1:5500,http://localhost:5173,http://localhost:3000,http://localhost:63342,http://127.0.0.1:63342
